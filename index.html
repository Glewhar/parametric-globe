<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Earth Globe Builder</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="scenarios.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="viewer">
    <div id="hover-tooltip" hidden></div>
  </main>

  <section id="hud-top" class="hud-player" data-state="paused"
           aria-label="Season playback">
    <button id="player-toggle" class="player-btn" type="button"
            aria-label="Play" data-state="paused"
            title="Play (Space)">
      <svg class="player-icon player-icon--play"  viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 5v14l11-7z"></path>
      </svg>
      <svg class="player-icon player-icon--pause" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="6"  y="5" width="4" height="14" rx="1"></rect>
        <rect x="14" y="5" width="4" height="14" rx="1"></rect>
      </svg>
    </button>
    <div class="player-meta">
      <div class="player-month" id="season-month" aria-live="polite">May</div>
      <div class="player-track" id="player-track"
           role="slider" aria-valuemin="1" aria-valuemax="12" aria-valuenow="5"
           aria-label="Month" tabindex="0">
        <div class="player-track-bg"></div>
        <div class="player-track-fill" id="player-fill"></div>
        <div class="player-dots" id="player-dots"></div>
      </div>
    </div>
    <div class="player-hints" aria-hidden="true">
      <span class="player-hint">
        <kbd class="player-kbd">Space</kbd>
        <span class="player-hint-text">play / pause</span>
      </span>
      <span class="player-hint">
        <kbd class="player-kbd">H</kbd>
        <span class="player-hint-text">hide UI</span>
      </span>
    </div>
  </section>

  <aside id="hud" aria-label="Globe controls">
    <section id="scenario-controls" class="hud-scenarios"
             aria-label="Climate scenarios" hidden>
      <div class="scenario-cats" id="scenario-cats" role="tablist"></div>
      <div class="scenario-intensities" id="scenario-intensities"></div>
    </section>
    <script type="module">
      import('./scenarios.js?v=' + Date.now());
    </script>

    <details class="hud-advanced" id="hud-advanced">
      <summary>
        <svg class="hud-chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Advanced
      </summary>
      <div class="hud-advanced-body">
        <div id="continent-toggles"><!-- filled by app.js --></div>
        <label class="toggle-row toggle-row--labels">
          <input type="checkbox" id="toggle-labels" />
          <span>Show region labels in 3D</span>
        </label>
      </div>
    </details>
  </aside>

  <script type="module">
    // Force a fresh app.js per page load. The viewer is served by python's
    // http.server which doesn't emit cache headers, so chrome aggressively
    // reuses the previous module after a regenerate.bat run.
    import('./app.js?v=' + Date.now());
  </script>
</body>
</html>
